name: Build and security regressions
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sms_security
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_SECRET: isolated-ci-fixture-secret-never-use-for-deployment
      DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/sms_security
      SECURITY_TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/sms_security
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NODE_ENV: production
      - name: Install browser for UI regressions
        run: npx playwright install --with-deps chromium
      - name: Check navigation and drawer loading
        run: npm --workspace=@school/web run test:browser
      - name: Initialize disposable test schema
        run: npm --workspace=@school/shared run db:push -- --force
      - run: npm --workspace=@school/api test
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
